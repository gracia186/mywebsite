<html>
<head>
<title> Tableaux</title>
</head>
<style>
table
{
border-collapse:collapse;
}
body{
background-color:silver;
}
td,th{
border: 5px solid black;
width: 20px;
height: 20px;
padding: 20px;
text-align:center;
}
h4{
border:ridge medium;
text-align:center;
background:cyan;
color:navy;
}
h2{
border: ridge medium;
text-align:center;
background:cyan;
color:navy;
}
</style>
<body>
<h2>•••Les Tableaux•••</h2>
<table>
<caption><h4>•Tableau1•</h4></caption>
<thead><!--En-tête du tableau-->
<tr>
<th colspan="2">A</th>
</tr>
</thead>
<tbody><!--Corps du tableau-->
<tr>
<td>B</td>
<td>C</td>
</tr>
</tbody>
</table>
<style type="text/css">
table
{
border-collapse:collapse;
}
td
{
border:4px solid black;
}
th
{
border:4px solid black;
}
.A {
background-color: red;
}
.C{
background-color: blue;
}
.b{
background-color: green;
}
</style>
<table>
<caption><h4>•Tableau2•</h4></caption>
<tr>
<th rowspan="2">D</th>
<th>E</th>
</tr>
<tr>
<th>F</th>
</tr>
</table>
<style type="text/css">
table
{
border-collapse:collapse;
}
td
{
border:4px solid black;
}
th
{
border:4px solid black;
}
</style>
<table>
<caption><h4>•Tableau de fusion•</h4></caption>
<tr>
<th class="a" rowspan="2">A</th>
<th colspan="3">B</th>
</tr>
<tr>
<th class="c" colspan="3">C</th>
</tr>
<tr>
<th rowspan="2">D</th>
<th class="b" rowspan="2">E</th>
<th>F</th>
</tr>
<tr>
<th class="g">G</th>
</tr>
</table>
</body>
</html>
